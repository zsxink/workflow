formatVersion: 1
project:
  id: sample-app
  name: Sample App
  authoritativeDocs: [docs/requirements.md, docs/design.md]
  rules: .workflow/rules.md
hosts: [codex]
modules:
  - id: app
    paths: [src/**, tests/**]
    role: developer
  - id: docs
    paths: [docs/**]
    role: developer
git:
  baseBranch: main
  branchPrefix: workflow/
integration:
  profile: local
  mode: prepare
tracking:
  required: false
  providers: []
validation:
  extraSourceInputs: []
  commands:
    - id: app-session-test
      executable: npm
      envAllowlist: [PATH]
      args: [test, --, tests/session]
      cwd: .
      timeoutSeconds: 300
      modules: [app]
      artifacts: [coverage/**]
    - id: app-test
      executable: npm
      envAllowlist: [PATH]
      args: [test]
      cwd: .
      timeoutSeconds: 300
      modules: [app]
      artifacts: [coverage/**]
    - id: app-build
      executable: npm
      envAllowlist: [PATH]
      args: [run, build]
      cwd: .
      timeoutSeconds: 300
      modules: [app]
      artifacts: [dist/**]
policy:
  retryLimit: 2
  crRoundLimit: 3
  epicConcurrency: 3
  requireScopedWriteIsolation: false
extensions: {}
